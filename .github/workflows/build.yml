name: Build Windows x86
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Test helpers
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc tests\common_test.cpp /Fe:common_test.exe && common_test.exe
      - name: Build plugin
        shell: cmd
        run: build.cmd
      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: loadzone-win32
          path: build/loadzone.asi
          if-no-files-found: error
